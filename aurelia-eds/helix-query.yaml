version: 1

indices:
  products:
    include:
      - /women/**
      - /men/**
      - /new-arrivals/**
      - /sale/**
    exclude:
      - /**.json
    target: /products.json
    properties:
      id:
        select: head > meta[name="product-id"]
        value: attribute(el, "content")
      name:
        select: head > meta[name="og:title"]
        value: attribute(el, "content")
      price:
        select: head > meta[name="product-price"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="product-category"]
        value: attribute(el, "content")
      gender:
        select: head > meta[name="product-gender"]
        value: attribute(el, "content")
      gradient:
        select: head > meta[name="product-gradient"]
        value: attribute(el, "content")
      tag:
        select: head > meta[name="product-tag"]
        value: attribute(el, "content")
    sort:
      - date: desc

  articles:
    include:
      - /journal/**
    target: /articles.json
    properties:
      title:
        select: head > meta[name="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="publication-date"]
        value: attribute(el, "content")
    sort:
      - date: desc
