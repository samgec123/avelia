<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Bag · AURELIA</title>
  <meta name="description" content="Review your AURELIA shopping bag.">
  <meta name="urn:adobe:aue:system:aemconnection" content="aem:https://author-placeholder.adobeaemcloud.com">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="icon" href="/icons/logo.svg">
  <script type="module" src="/scripts/scripts.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => { window.adobeDataLayer = window.adobeDataLayer || []; window.adobeDataLayer.push({ event: 'page view', page: { pageName: 'cart', pageType: 'cart', siteSection: 'checkout' } }); });</script>
</head>
<body>
  <header></header>
  <main>
    <div>
      <div class="columns columns--sidebar" data-aue-type="component" data-aue-label="Cart">
        <div>
          <div>
            <h1 style="font-family:var(--font-display);font-weight:300;font-size:56px;margin-bottom:32px;">Your <em style="font-style:italic;">Bag</em></h1>
            <p style="color:var(--ink-soft);padding:60px 0;border-top:1px solid var(--line);text-align:center;">Your bag is empty. <a href="/women" style="text-decoration:underline;">Continue shopping</a></p>
          </div>
          <div>
            <div style="background:var(--paper);padding:32px;border:1px solid var(--line);">
              <h3 style="font-family:var(--font-display);font-size:24px;font-weight:400;margin-bottom:20px;">Order Summary</h3>
              <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid var(--line);"><span>Subtotal</span><span>—</span></div>
              <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:14px;"><span>Shipping</span><span>Complimentary</span></div>
              <div style="display:flex;justify-content:space-between;padding:18px 0 0;font-weight:600;font-size:16px;border-top:1px solid var(--line);margin-top:12px;"><span>Total</span><span>—</span></div>
              <a href="/checkout" class="btn btn-accent" style="width:100%;text-align:center;display:block;margin-top:24px;">Proceed to Checkout</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
